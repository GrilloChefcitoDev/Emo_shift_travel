<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="EMO-SHIFT TRAVEL — Logo" shape-rendering="crispEdges">
  <!-- Fondo tinta con marco cobre -->
  <rect width="320" height="320" fill="#111922"/>
  <rect x="8" y="8" width="304" height="304" fill="none" stroke="#c98263" stroke-width="4"/>
  <rect x="14" y="14" width="292" height="292" fill="none" stroke="#46545e" stroke-width="1"/>

  <!-- ============ ESCENA: ANDÉN CERO ============ -->
  <!-- Cielo / fondo atmosférico -->
  <rect x="20" y="20" width="280" height="120" fill="#19232d"/>

  <!-- Estrellas pixel-art en el cielo -->
  <rect x="40" y="40" width="2" height="2" fill="#e5e0d4"/>
  <rect x="38" y="42" width="2" height="2" fill="#e5e0d4"/>
  <rect x="42" y="42" width="2" height="2" fill="#e5e0d4"/>
  <rect x="40" y="44" width="2" height="2" fill="#e5e0d4"/>

  <rect x="80" y="32" width="2" height="2" fill="#d1b77a"/>
  <rect x="78" y="34" width="2" height="2" fill="#d1b77a"/>
  <rect x="82" y="34" width="2" height="2" fill="#d1b77a"/>
  <rect x="80" y="36" width="2" height="2" fill="#d1b77a"/>

  <rect x="240" y="44" width="2" height="2" fill="#e5e0d4"/>
  <rect x="238" y="46" width="2" height="2" fill="#e5e0d4"/>
  <rect x="242" y="46" width="2" height="2" fill="#e5e0d4"/>
  <rect x="240" y="48" width="2" height="2" fill="#e5e0d4"/>

  <rect x="200" y="28" width="2" height="2" fill="#d1b77a"/>
  <rect x="280" y="60" width="2" height="2" fill="#e5e0d4"/>

  <!-- Luna mate (pequeña) -->
  <rect x="270" y="34" width="14" height="14" fill="#d1b77a"/>
  <rect x="268" y="36" width="2" height="2" fill="#d1b77a"/>
  <rect x="268" y="40" width="2" height="2" fill="#d1b77a"/>
  <rect x="272" y="32" width="10" height="2" fill="#d1b77a"/>
  <rect x="272" y="48" width="10" height="2" fill="#d1b77a"/>
  <rect x="284" y="36" width="2" height="2" fill="#d1b77a"/>
  <rect x="284" y="40" width="2" height="2" fill="#d1b77a"/>
  <!-- Cráteres -->
  <rect x="274" y="38" width="2" height="2" fill="#92784e"/>
  <rect x="278" y="42" width="3" height="2" fill="#92784e"/>
  <rect x="276" y="44" width="2" height="2" fill="#92784e"/>

  <!-- Vías del tren (perspectiva) -->
  <rect x="20" y="200" width="280" height="2" fill="#46545e"/>
  <rect x="20" y="206" width="280" height="2" fill="#46545e"/>
  <rect x="20" y="212" width="280" height="2" fill="#46545e"/>
  <!-- Traviesas -->
  <g fill="#5b6971">
    <rect x="30" y="200" width="6" height="14"/>
    <rect x="60" y="200" width="6" height="14"/>
    <rect x="90" y="200" width="6" height="14"/>
    <rect x="120" y="200" width="6" height="14"/>
    <rect x="150" y="200" width="6" height="14"/>
    <rect x="180" y="200" width="6" height="14"/>
    <rect x="210" y="200" width="6" height="14"/>
    <rect x="240" y="200" width="6" height="14"/>
    <rect x="270" y="200" width="6" height="14"/>
  </g>
  <!-- Rieles (líneas horizontales doradas) -->
  <rect x="20" y="198" width="280" height="1" fill="#d1b77a"/>
  <rect x="20" y="218" width="280" height="1" fill="#92784e"/>

  <!-- Farol izquierdo -->
  <rect x="34" y="120" width="2" height="80" fill="#46545e"/>
  <rect x="32" y="118" width="6" height="4" fill="#7c898c"/>
  <rect x="30" y="116" width="10" height="2" fill="#5b6971"/>
  <rect x="34" y="122" width="2" height="2" fill="#d1b77a"/>
  <rect x="32" y="124" width="6" height="2" fill="#d1b77a"/>
  <rect x="34" y="126" width="2" height="2" fill="#d1b77a"/>
  <!-- Base del farol -->
  <rect x="30" y="198" width="10" height="4" fill="#46545e"/>

  <!-- Farol derecho -->
  <rect x="284" y="120" width="2" height="80" fill="#46545e"/>
  <rect x="282" y="118" width="6" height="4" fill="#7c898c"/>
  <rect x="280" y="116" width="10" height="2" fill="#5b6971"/>
  <rect x="284" y="122" width="2" height="2" fill="#d1b77a"/>
  <rect x="282" y="124" width="6" height="2" fill="#d1b77a"/>
  <rect x="284" y="126" width="2" height="2" fill="#d1b77a"/>
  <rect x="280" y="198" width="10" height="4" fill="#46545e"/>

  <!-- ============ NARA (sprite pixel-art simplificado) ============ -->
  <!-- Posición: centro, junto a las vías -->
  <g transform="translate(140, 132)">
    <!-- Sombra -->
    <rect x="6" y="62" width="28" height="2" fill="#0d1419" opacity="0.6"/>
    <!-- Piernas (pantalón) -->
    <rect x="8" y="46" width="8" height="16" fill="#3a4a52"/>
    <rect x="22" y="46" width="8" height="16" fill="#3a4a52"/>
    <!-- Zapatos -->
    <rect x="6" y="60" width="12" height="4" fill="#1a1a1a"/>
    <rect x="22" y="60" width="12" height="4" fill="#1a1a1a"/>
    <!-- Cuerpo (vestido/abrigo) -->
    <rect x="6" y="26" width="28" height="22" fill="#5c9289"/>
    <rect x="8" y="28" width="24" height="2" fill="#86afa3"/>
    <!-- Mangas -->
    <rect x="4" y="28" width="4" height="14" fill="#5c9289"/>
    <rect x="32" y="28" width="4" height="14" fill="#5c9289"/>
    <!-- Manos -->
    <rect x="4" y="42" width="4" height="4" fill="#d4a87a"/>
    <rect x="32" y="42" width="4" height="4" fill="#d4a87a"/>
    <!-- Cabeza -->
    <rect x="12" y="8" width="16" height="18" fill="#d4a87a"/>
    <!-- Pelo (negro azulado) -->
    <rect x="10" y="6" width="20" height="4" fill="#1a1a2a"/>
    <rect x="8" y="8" width="4" height="8" fill="#1a1a2a"/>
    <rect x="28" y="8" width="4" height="8" fill="#1a1a2a"/>
    <rect x="10" y="12" width="2" height="2" fill="#1a1a2a"/>
    <rect x="28" y="12" width="2" height="2" fill="#1a1a2a"/>
    <!-- Ojos -->
    <rect x="14" y="16" width="2" height="2" fill="#1a1a2a"/>
    <rect x="24" y="16" width="2" height="2" fill="#1a1a2a"/>
    <!-- Boca -->
    <rect x="18" y="22" width="4" height="1" fill="#8a4a35"/>
    <!-- Mechón de pelo calma (verde azulado) que comunica la emoción -->
    <rect x="14" y="4" width="2" height="2" fill="#548A82"/>
    <rect x="22" y="4" width="4" height="2" fill="#548A82"/>
    <!-- Bufanda -->
    <rect x="12" y="24" width="16" height="4" fill="#C45B3D"/>
    <rect x="14" y="28" width="2" height="6" fill="#C45B3D"/>
    <rect x="16" y="32" width="2" height="2" fill="#8a3d28"/>
  </g>

  <!-- ============ TREN LEJANO (silueta pixel-art) ============ -->
  <g transform="translate(60, 160)" opacity="0.7">
    <!-- Cuerpo del tren -->
    <rect x="0" y="0" width="40" height="20" fill="#2a3540"/>
    <rect x="2" y="2" width="36" height="16" fill="#1a2530"/>
    <!-- Ventanas -->
    <rect x="6" y="6" width="6" height="6" fill="#d1b77a"/>
    <rect x="16" y="6" width="6" height="6" fill="#d1b77a"/>
    <rect x="26" y="6" width="6" height="6" fill="#d1b77a"/>
    <!-- Chimenea/humo -->
    <rect x="32" y="-6" width="4" height="6" fill="#2a3540"/>
    <rect x="32" y="-10" width="4" height="2" fill="#46545e" opacity="0.6"/>
    <rect x="34" y="-14" width="4" height="2" fill="#5b6971" opacity="0.4"/>
    <!-- Ruedas -->
    <rect x="4" y="20" width="6" height="4" fill="#1a1a1a"/>
    <rect x="30" y="20" width="6" height="4" fill="#1a1a1a"/>
    <!-- Faro delantero -->
    <rect x="38" y="8" width="2" height="2" fill="#d1b77a"/>
  </g>

  <!-- ============ LOGO TIPO: EMO-SHIFT TRAVEL ============ -->
  <!-- EMO-SHIFT (grande, cobre) -->
  <text x="160" y="252" font-family="'Courier New', monospace" font-weight="bold" font-size="28" letter-spacing="6" text-anchor="middle" fill="#d59672" text-shadow="2px 2px 0 #2a1a16">EMO-SHIFT</text>
  <!-- TRAVEL (pequeño, marfil, mucho espaciado) -->
  <text x="160" y="278" font-family="'Courier New', monospace" font-weight="bold" font-size="18" letter-spacing="14" text-anchor="middle" fill="#e5e0d4">TRAVEL</text>
  <!-- Subtítulo -->
  <text x="160" y="298" font-family="'Courier New', monospace" font-size="9" letter-spacing="3" text-anchor="middle" fill="#a093b6">VIAJE DE RECUERDOS</text>

  <!-- 4 swatches de emociones al pie (pixel-art) -->
  <g shape-rendering="crispEdges">
    <rect x="86" y="306" width="14" height="4" fill="#C45B3D"/>
    <rect x="104" y="306" width="14" height="4" fill="#548A82"/>
    <rect x="122" y="306" width="14" height="4" fill="#806E9C"/>
    <rect x="140" y="306" width="14" height="4" fill="#A99B55"/>
    <!-- separator dots -->
    <rect x="160" y="307" width="2" height="2" fill="#46545e"/>
    <rect x="166" y="307" width="2" height="2" fill="#46545e"/>
    <!-- Grillo Studio credit -->
    <text x="200" y="310" font-family="'Courier New', monospace" font-size="8" fill="#7b8188" letter-spacing="2">GRILLO STUDIO</text>
  </g>
</svg>
