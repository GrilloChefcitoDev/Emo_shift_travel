<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · EMO-SHIFT TRAVEL — Presskit</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logos/logo.svg">
<link rel="stylesheet" href="css/presskit.css">
<style>
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    text-align:center; padding:24px;
  }
  .err-box{
    max-width:520px; padding:32px;
    border:2px solid var(--accent); background:var(--bg-panel);
  }
  .err-code{
    font-family:var(--font-pixel); font-size:64px; color:var(--accent);
    letter-spacing:8px; margin-bottom:8px; text-shadow:2px 2px 0 #2a1a16;
  }
  .err-title{
    font-family:var(--font-pixel); font-size:18px; color:var(--fg);
    letter-spacing:3px; margin-bottom:16px;
  }
  .err-msg{ color:var(--fg-dim); font-size:15px; line-height:1.6; margin-bottom:24px; }
  .err-cta{
    display:inline-block; padding:12px 28px;
    font-family:var(--font-pixel); font-size:12px; letter-spacing:2px;
    background:var(--accent); color:#0c1418; text-decoration:none;
    border:1px solid var(--accent); transition:all .15s;
  }
  .err-cta:hover{ background:var(--accent-bright); border-color:var(--accent-bright); }
</style>
</head>
<body>
  <div class="err-box">
    <div class="err-code">404</div>
    <div class="err-title">RECUERDO NO ENCONTRADO</div>
    <p class="err-msg">
      El Andén Cero no reconoce esta dirección. Quizá el tren ya partió
      o el recuerdo se disolvió.
    </p>
    <a href="/" class="err-cta">VOLVER AL ANDÉN</a>
  </div>
</body>
</html>
